<div class="movie-card">
    <p class="movie-title">My favorite Movie is {{movieTitle}}</p>

    <img class="movie-poster" [src]="moviePoster" alt="">

    <p class="movie-info">Description: {{movieDescription}}</p>
    <p class="movie-info">Release Date: {{ movieReleaseDate | date: 'MMMM d, y' }}</p>
    <p class="movie-info">IMDb Rating: {{movieImbdRating}}</p>
    <p class="movie-info">Genre: {{movieGenre}}</p>

    <input class="movie-input" [(ngModel)]="titleInput" (input)="movieTitle = titleInput" />

    <button class="movie-button" (click)="alertTitle()">Press Me</button>
    <a class="movie-link" [href]="moveOficialLink" target="_blank">IMDb Offical Page</a>
</div>
